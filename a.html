<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossDaun Gallery</title>
    <link rel="shortcut icon" href="./static/favicon.ico" />
    <style>
        :root {
            --bg-primary: #0a0c10;
            --card-bg: rgba(18, 22, 31, 0.9);
            --bg-secondary: rgba(15, 18, 26, 0.95);
            --accent-cyan: #00f2fe;
            --accent-purple: #9d4edd;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-glow: rgba(0, 242, 254, 0.15);
            --danger: #ff5555;
            --radius: 14px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            width: 100%;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-glow);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .photo-counter {
            color: var(--accent-cyan);
            font-size: 0.85rem;
            background: rgba(0, 242, 254, 0.08);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* Панель управления: Фильтры и Сортировки */
        .controls-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            padding: 4px 10px;
        }

        .control-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        select.sort-select {
            background: transparent;
            border: none;
            color: var(--accent-cyan);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            padding: 4px;
        }

        select.sort-select option {
            background: #0e121b;
            color: var(--text-main);
        }

        .custom-select-wrapper {
            position: relative;
            min-width: 240px;
        }

        .select-trigger {
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(14, 18, 27, 0.98);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            max-height: 300px;
            z-index: 100;
            overflow: hidden;
        }

        .custom-select-wrapper.open .dropdown-menu {
            display: flex;
        }

        .dropdown-list {
            overflow-y: auto;
            max-height: 240px;
        }

        .dropdown-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: var(--transition);
        }

        .dropdown-item:hover {
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-cyan);
        }

        .dropdown-item input[type="checkbox"] {
            accent-color: var(--accent-cyan);
            cursor: pointer;
        }

        main {
            flex: 1;
            padding: 20px 0;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .photo-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 1 / 1;
            border: 1px solid var(--border-glow);
            position: relative;
            transition: var(--transition);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 12, 16, 0.85);
            padding: 6px 10px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            backdrop-filter: blur(4px);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 30px;
        }

        .page-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .page-btn.active {
            background: var(--accent-cyan);
            color: #000;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 8px;
            }
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="header-content">
                <div class="title-area">
                    <h1>🖼 Галерея изображений</h1>
                    <span class="photo-counter" id="photoCounter">Найдено: 0</span>
                </div>
                
                <div class="controls-row">
                    <!-- Выбор категорий -->
                    <div class="custom-select-wrapper" id="categoryDropdown">
                        <div class="select-trigger" onclick="toggleDropdown()">
                            <span id="selectedCategoryName">Все категории</span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="dropdown-menu">
                            <div class="dropdown-list" id="dropdownList"></div>
                        </div>
                    </div>

                    <!-- Поле сортировки -->
                    <div class="control-group">
                        <span class="control-label">Сортировать по:</span>
                        <select id="sortBySelect" class="sort-select" onchange="applyFiltersAndSort()">
                            <option value="edit_date">Дате изменения</option>
                            <option value="id">ID фото</option>
                        </select>
                    </div>

                    <!-- Порядок сортировки -->
                    <div class="control-group">
                        <span class="control-label">Порядок:</span>
                        <select id="sortOrderSelect" class="sort-select" onchange="applyFiltersAndSort()">
                            <option value="DESC">Сначала новые (DESC)</option>
                            <option value="ASC">Сначала старые (ASC)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="gallery-grid" id="galleryGrid"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </main>

    <script>
        // ДЕМО-ДАННЫЕ ДЛЯ ПРОВЕРКИ (Имитация ответа сервера)
        const MOCK_CATEGORIES = [
            { id: 1, name: 'Природа' },
            { id: 2, name: 'Город' },
            { id: 3, name: 'Арт' }
        ];

        const MOCK_PHOTOS = [
            { id: 101, file_url: 'https://picsum.photos/id/10/300/300', category_id: 1, edit_date: '2026-09-15T10:00:00' },
            { id: 102, file_url: 'https://picsum.photos/id/20/300/300', category_id: 2, edit_date: '2026-09-17T08:30:00' },
            { id: 103, file_url: 'https://picsum.photos/id/30/300/300', category_id: 3, edit_date: '2026-09-10T14:20:00' },
            { id: 104, file_url: 'https://picsum.photos/id/40/300/300', category_id: 1, edit_date: '2026-09-16T19:45:00' },
            { id: 105, file_url: 'https://picsum.photos/id/50/300/300', category_id: 2, edit_date: '2026-09-11T12:00:00' },
            { id: 106, file_url: 'https://picsum.photos/id/60/300/300', category_id: 3, edit_date: '2026-09-17T09:10:00' }
        ];

        const ITEMS_PER_PAGE = 4;
        let selectedCategoryIds = []; // Хранит ID выбранных категорий (пустой = все)
        let filteredPhotos = [];
        let currentPage = 1;

        document.addEventListener('DOMContentLoaded', () => {
            renderDropdownList();
            applyFiltersAndSort();
            setupOutsideClick();
        });

        // 1. Отрисовка списка категорий с чекбоксами
        function renderDropdownList() {
            const container = document.getElementById('dropdownList');
            container.innerHTML = '';

            // Опция "Все"
            const allItem = document.createElement('div');
            allItem.className = 'dropdown-item';
            allItem.innerHTML = `
                <input type="checkbox" id="cat_all" ${selectedCategoryIds.length === 0 ? 'checked' : ''} onchange="selectAllCategories(this.checked)">
                <label for="cat_all"> Все категории</label>
            `;
            container.appendChild(allItem);

            // Опции отдельных категорий
            MOCK_CATEGORIES.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                const isChecked = selectedCategoryIds.includes(cat.id);
                item.innerHTML = `
                    <input type="checkbox" id="cat_${cat.id}" value="${cat.id}" ${isChecked ? 'checked' : ''} onchange="toggleCategoryFilter(${cat.id}, this.checked)">
                    <label for="cat_${cat.id}">${cat.name}</label>
                `;
                container.appendChild(item);
            });
        }

        function selectAllCategories(isChecked) {
            if (isChecked) {
                selectedCategoryIds = [];
            }
            renderDropdownList();
            updateDropdownTitle();
            applyFiltersAndSort();
        }

        function toggleCategoryFilter(catId, isChecked) {
            if (isChecked) {
                selectedCategoryIds.push(catId);
            } else {
                selectedCategoryIds = selectedCategoryIds.filter(id => id !== catId);
            }
            renderDropdownList();
            updateDropdownTitle();
            applyFiltersAndSort();
        }

        function updateDropdownTitle() {
            const label = document.getElementById('selectedCategoryName');
            if (selectedCategoryIds.length === 0) {
                label.innerText = 'Все категории';
            } else {
                label.innerText = `Выбрано категорий: ${selectedCategoryIds.length}`;
            }
        }

        // 2. Логика фильтрации и сортировки
        function applyFiltersAndSort() {
            const sortBy = document.getElementById('sortBySelect').value;
            const sortOrder = document.getElementById('sortOrderSelect').value;

            // Фильтрация
            filteredPhotos = MOCK_PHOTOS.filter(photo => {
                if (selectedCategoryIds.length === 0) return true;
                return selectedCategoryIds.includes(photo.category_id);
            });

            // Сортировка
            filteredPhotos.sort((a, b) => {
                let valA = a[sortBy];
                let valB = b[sortBy];

                if (sortBy === 'edit_date') {
                    valA = new Date(valA);
                    valB = new Date(valB);
                }

                if (sortOrder === 'ASC') {
                    return valA > valB ? 1 : -1;
                } else {
                    return valA < valB ? 1 : -1;
                }
            });

            currentPage = 1;
            document.getElementById('photoCounter').innerText = `Найдено: ${filteredPhotos.length}`;
            renderGallery();
            renderPagination();
        }

        // 3. Отрисовка фото
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pagePhotos = filteredPhotos.slice(start, end);

            if (pagePhotos.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Нет фото по заданным условиям</div>';
                return;
            }

            pagePhotos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                const formattedDate = new Date(photo.edit_date).toLocaleDateString('ru-RU', {
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                });

                card.innerHTML = `
                    <img src="${photo.file_url}" alt="Photo #${photo.id}">
                    <div class="photo-info">
                        <span>ID: ${photo.id}</span>
                        <span>${formattedDate}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 4. Пагинация
        function renderPagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';

            const totalPages = Math.ceil(filteredPhotos.length / ITEMS_PER_PAGE);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    currentPage = i;
                    renderGallery();
                    renderPagination();
                };
                container.appendChild(btn);
            }
        }

        // Вспомогательные функции для выпадающего списка
        function toggleDropdown() {
            document.getElementById('categoryDropdown').classList.toggle('open');
        }

        function setupOutsideClick() {
            document.addEventListener('click', (e) => {
                const wrapper = document.getElementById('categoryDropdown');
                if (!wrapper.contains(e.target)) {
                    wrapper.classList.remove('open');
                }
            });
        }
    </script>
</body>
</html>
