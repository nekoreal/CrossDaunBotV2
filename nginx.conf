events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 100M;

    # Редирект с HTTP на HTTPS для всех доменов
    server {
        listen 80;
        server_name crossdaun.duckdns.org s3-crossdaun.duckdns.org s3-admin-crossdaun.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # 1. FLASK ВЕБ-САЙТ (HTTPS)
    server {
        listen 443 ssl;
        server_name crossdaun.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/crossdaun.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crossdaun.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://bot:5002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets для Flask-SocketIO
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 2. MINIO S3 API (HTTPS)
    server {
        listen 443 ssl;
        server_name s3-crossdaun.duckdns.org;

        # Используем родной сгенерированный сертификат для s3-поддомена
        ssl_certificate /etc/letsencrypt/live/s3-crossdaun.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/s3-crossdaun.duckdns.org/privkey.pem;

        ignore_invalid_headers off;
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://minio:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
        }
    }

    # 3. MINIO CONSOLE (HTTPS)
    server {
        listen 443 ssl;
        server_name s3-admin-crossdaun.duckdns.org;
 
        ssl_certificate /etc/letsencrypt/live/s3-crossdaun.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/s3-crossdaun.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://minio:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}