events {
    worker_connections 1024;
}

http {
    include        mime.types;
    default_type   application/octet-stream;
    client_max_body_size 100M;
    server_tokens  off; # Скрываем версию Nginx

    # Зона Rate Limiting для защиты от ботов/сканеров (20 req/s с IP)
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=20r/s;
    limit_req_status 429;

    # Черная дыра для сканеров уязвимостей и мусора (закрывает соединения без ответа)
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        
        # Заглушка SSL для default_server (если нужно, либо просто return 444 на домены не из списка)
        ssl_reject_handshake on; # Nginx 1.19.4+: отклоняет SSL-рукопожатие для неизвестных доменов
    }

    # Редирект с HTTP на HTTPS для всех наших доменов
    server {
        listen 80;
        server_name crossdaun.duckdns.org s3-crossdaun.duckdns.org s3-admin-crossdaun.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # ОБЩИЙ БЛОК БЛОКИРОВКИ МУСОРА (можно вынести или дублировать в нужном server/location)
    # Ниже показано вменение блокировок прямо в сервер Flask или через общие правила.

    # 1. FLASK ВЕБ-САЙТ (HTTPS)
    server {
        listen 443 ssl;
        server_name crossdaun.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/crossdaun.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crossdaun.duckdns.org/privkey.pem;

        # Блокировка сканирования скрытых файлов (.env, .git, .well-known и т.д.)
        location ~ /\.(env|git|ht|well-known) {
            return 444;
        }

        # Блокировка типовых веб-сканеров/админок
        location ~* /(phpmyadmin|wp-admin|xmlrpc\.php|eval-stdin|security\.txt) {
            return 444;
        }

        location / {
            # Применяем защиту от флуда/сканеров
            limit_req zone=global_limit burst=30 nodelay;

            proxy_pass http://bot:5002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets для Flask-SocketIO
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 2. MINIO S3 API (HTTPS)
    server {
        listen 443 ssl;
        server_name s3-crossdaun.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/s3-crossdaun.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/s3-crossdaun.duckdns.org/privkey.pem;

        ignore_invalid_headers off;
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://minio:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
        }
    }

    # 3. MINIO CONSOLE (HTTPS)
    server {
        listen 443 ssl;
        server_name s3-admin-crossdaun.duckdns.org;
 
        ssl_certificate /etc/letsencrypt/live/s3-crossdaun.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/s3-crossdaun.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://minio:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}