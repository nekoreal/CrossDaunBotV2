<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossDaun Gallery</title>
    <link rel="shortcut icon" href="./static/favicon.ico" />
    <style>
        :root {
            --bg-primary: #0a0c10;
            --card-bg: rgba(18, 22, 31, 0.75);
            --bg-secondary: rgba(15, 18, 26, 0.85);
            --accent-cyan: #00f2fe;
            --accent-purple: #9d4edd;
            --accent-hover: #00c6ff;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-glow: rgba(0, 242, 254, 0.15);
            --border-purple: rgba(157, 78, 221, 0.25);
            --danger: #ff5555;
            --success: #2ecc71;
            --radius: 14px;
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Контейнер для всплывающих уведомлений */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            min-width: 300px;
            padding: 12px 24px;
            border-radius: var(--radius);
            background: rgba(14, 18, 27, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            font-size: 0.95rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.2);
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .toast.error {
            border-color: rgba(255, 85, 85, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 85, 85, 0.3);
            color: var(--danger);
        }

        /* Фоновые неоновые пятна */
        .glow-sphere-1 {
            position: fixed;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.2) 0%, rgba(0,0,0,0) 70%);
            top: -50px;
            left: -50px;
            z-index: 0;
            filter: blur(60px);
            animation: pulse 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .glow-sphere-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            right: -50px;
            z-index: 0;
            filter: blur(70px);
            animation: pulse 10s infinite alternate-reverse ease-in-out;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(20px, -20px); }
        }

        header {
            background-color: var(--bg-secondary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glow);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        .photo-counter {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            background: rgba(0, 242, 254, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .controls-row {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Выпадающее меню выбора категории */
        .custom-select-wrapper {
            position: relative;
            min-width: 260px;
            flex-shrink: 0;
        }

        .select-trigger {
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            font-size: 0.95rem;
            color: var(--text-main);
            backdrop-filter: blur(12px);
        }

        .select-trigger:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .select-trigger .arrow {
            font-size: 0.75rem;
            transition: transform 0.2s;
            color: var(--accent-cyan);
        }

        .custom-select-wrapper.open .select-trigger {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .custom-select-wrapper.open .arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(14, 18, 27, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.1);
            display: none;
            flex-direction: column;
            max-height: 350px;
            z-index: 100;
            overflow: hidden;
        }

        .custom-select-wrapper.open .dropdown-menu {
            display: flex;
        }

        .dropdown-search {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background-color: rgba(0, 0, 0, 0.2);
        }

        .dropdown-search input {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .dropdown-search input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .dropdown-list {
            overflow-y: auto;
            max-height: 280px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-cyan) transparent;
        }

        .dropdown-item {
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .dropdown-item:hover {
            background-color: rgba(0, 242, 254, 0.12);
            color: #fff;
        }

        .dropdown-item.selected {
            background: linear-gradient(90deg, rgba(0, 242, 254, 0.25) 0%, rgba(157, 78, 221, 0.25) 100%);
            border-left: 3px solid var(--accent-cyan);
            color: #fff;
        }

        .dropdown-item .badge {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* Кнопки быстрого доступа */
        .quick-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }

        .quick-chips::-webkit-scrollbar {
            display: none;
        }

        .chip-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }

        .chip-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--text-main);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
        }

        .chip-btn.active {
            background: rgba(0, 242, 254, 0.12);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        main {
            flex: 1;
            padding: 30px 0;
            position: relative;
            z-index: 1;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            border: 1px solid var(--border-glow);
            transition: var(--transition);
            position: relative;
            backdrop-filter: blur(12px);
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 242, 254, 0.25);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo-card:hover img {
            transform: scale(1.03);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
        }

        .page-btn.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.8) 0%, rgba(157, 78, 221, 0.8) 100%);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .page-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.05);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(5, 7, 10, 0.92);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative; /* Обязательно: точка отсчета для абсолютного позиционирования кнопок */
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 72vh;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 242, 254, 0.15);
        }

        .lightbox-caption {
            margin-top: 15px;
            color: var(--text-main);
            font-size: 0.95rem;
            text-align: center;
            background: rgba(18, 22, 31, 0.8);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-glow);
        }

        .lightbox-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: var(--card-bg);
            color: var(--accent-cyan);
            border: 1px solid var(--border-glow);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.15);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            color: #fff;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-cyan);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: var(--transition);
        }

        .lightbox-close:hover {
            background: rgba(255, 85, 85, 0.2);
            border-color: var(--danger);
            color: var(--danger);
            box-shadow: 0 0 15px rgba(255, 85, 85, 0.3);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(18, 22, 31, 0.6);
            color: var(--accent-cyan);
            border: 1px solid var(--border-glow);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            z-index: 10; /* Кнопки показываются поверх изображения */
        }

        .lightbox-nav:hover {
            background: rgba(0, 242, 254, 0.25);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            color: #fff;
        }
        /* Кнопка "На главную" */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            color: var(--accent-cyan);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            text-decoration: none;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .btn-home:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.15);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-home svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Вспомогательная обертка для заголовка и кнопки */
        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lightbox-prev { left: 15px; }
        .lightbox-next { right: 15px; }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            header {
                padding: 12px 0;
            }

            .header-content {
                gap: 12px;
            }

            .title-area {
                align-items: flex-start;
                gap: 6px;
            }

            h1 {
                font-size: 1.25rem;
            }

            .photo-counter {
                font-size: 0.8rem;
                padding: 4px 10px;
            }

            .controls-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .custom-select-wrapper {
                width: 100%;
                min-width: 0;
            }

            .quick-chips {
                width: 100%;
                padding-bottom: 4px;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }

            .pagination {
                margin-top: 24px;
                gap: 6px;
                max-width: 100%;
                overflow-x: auto;
                padding: 6px 0;
                justify-content: flex-start;
                scrollbar-width: none;
            }

            .pagination::-webkit-scrollbar {
                display: none;
            }

            .page-btn {
                width: 38px;
                height: 38px;
                font-size: 0.9rem;
                flex-shrink: 0;
            }

            .lightbox-content {
                max-width: 95vw;
                max-height: 80vh;
            }

            .lightbox-content img {
                max-height: 60vh;
                border-radius: 8px;
            }

            .lightbox-close {
                top: 12px;
                right: 12px;
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
                background: rgba(18, 22, 31, 0.8);
            }

            .lightbox-nav {
                width: 42px;
                height: 42px;
                font-size: 1.1rem;
                background: rgba(18, 22, 31, 0.75);
            }

            .lightbox-prev { left: 8px; }
            .lightbox-next { right: 8px; }

            .lightbox-caption {
                font-size: 0.85rem;
                padding: 6px 14px;
                margin-top: 10px;
            }

            .btn-action {
                padding: 8px 16px;
                font-size: 0.82rem;
            }


        }
    </style>
</head>
<body data-is-moder="{{ 'true' if user and user.is_moder else 'false' }}"> 

    <!-- Контейнер для всплывающих уведомлений -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Фоновые эффекты свечения -->
    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <header>
        <div class="container">
            <div class="header-content">
                <div class="title-area">
                    <div class="header-title-wrapper">
                        <a href="/" class="btn-home" title="На главную">
                            <svg viewBox="0 0 24 24">
                                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                            </svg>
                        </a>
                        <h1 id="categoryTitle">📁 Загрузка категорий...</h1>
                    </div>
                    <span class="photo-counter" id="photoCounter"></span>
                </div>
                
                <div class="controls-row">
                    <div class="custom-select-wrapper" id="categoryDropdown">
                        <div class="select-trigger" onclick="toggleDropdown()">
                            <span id="selectedCategoryName">Выберите категорию</span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="dropdown-menu">
                            <div class="dropdown-search">
                                <input type="text" id="catSearchInput" placeholder="Поиск категории..." oninput="filterCategories()">
                            </div>
                            <div class="dropdown-list" id="dropdownList">
                                <!-- Элементы категорий -->
                            </div>
                        </div>
                    </div>

                    <div class="quick-chips" id="quickChipsContainer">
                        <!-- Чипсы категорий -->
                    </div>
                </div>

            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="gallery-grid" id="galleryGrid">
                <!-- Карточки фотографий -->
            </div>
            <div class="pagination" id="pagination">
                <!-- Пагинация -->
            </div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        
        <div class="lightbox-content">
            <!-- Кнопки пролистывания теперь внутри контейнера с фото -->
            <button class="lightbox-nav lightbox-prev" onclick="changeLightboxImage(-1)">&#10094;</button>
            <img id="lightboxImg" src="" alt="Enlarged image">
            <button class="lightbox-nav lightbox-next" onclick="changeLightboxImage(1)">&#10095;</button>

            <div class="lightbox-caption" id="lightboxCaption"></div>
            <div class="lightbox-actions" id="lightboxActions"></div>
        </div>
    </div>

    <script> 
        const IS_MODER = document.body.dataset.isModer === 'true';

        const ITEMS_PER_PAGE = 32;
        let categoriesList = [];       
        let currentCategoryId = null;  
        let currentPage = 1;           
        let currentPhotos = [];        
        let currentLightboxIndex = 0;  
        let totalPages = 1;            

        document.addEventListener('DOMContentLoaded', () => {
            initGallery();
            setupKeyboardNavigation();
            setupOutsideClick();
        });

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : 'success'}`;
            toast.innerText = message;
            
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function initGallery() {
            try {
                const response = await fetch('/gallery/get_categories');
                if (!response.ok) throw new Error('Ошибка при загрузке категорий');
                
                categoriesList = await response.json();

                if (categoriesList.length === 0) {
                    document.getElementById('categoryTitle').innerText = '📁 Категории отсутствуют';
                    document.getElementById('selectedCategoryName').innerText = 'Нет категорий';
                    return;
                }

                renderCategoryControls();
                selectCategory(categoriesList[0].category_id);
            } catch (error) {
                console.error('API Error:', error);
                document.getElementById('categoryTitle').innerText = '❌ Ошибка загрузки данных';
            }
        }

        function renderCategoryControls() {
            renderDropdownList(categoriesList);
            renderQuickChips();
        }

        function renderDropdownList(list) {
            const container = document.getElementById('dropdownList');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div style="padding: 12px; color: var(--text-muted); text-align: center; font-size: 0.85rem;">Ничего не найдено</div>';
                return;
            }

            list.forEach(cat => {
                const item = document.createElement('div');
                item.className = `dropdown-item ${cat.category_id === currentCategoryId ? 'selected' : ''}`;
                item.innerHTML = `
                    <span>${cat.name}</span>
                    <span class="badge">${cat.photo_count}</span>
                `;
                item.onclick = () => {
                    selectCategory(cat.category_id);
                    closeDropdown();
                };
                container.appendChild(item);
            });
        }

        function renderQuickChips() {
            const container = document.getElementById('quickChipsContainer');
            container.innerHTML = '';

            const topCategories = categoriesList.slice(0, 5);
            topCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `chip-btn ${cat.category_id === currentCategoryId ? 'active' : ''}`;
                btn.innerText = `${cat.name} (${cat.photo_count})`;
                btn.onclick = () => selectCategory(cat.category_id);
                container.appendChild(btn);
            });
        }

        function filterCategories() {
            const query = document.getElementById('catSearchInput').value.toLowerCase().trim();
            const filtered = categoriesList.filter(c => c.name.toLowerCase().includes(query));
            renderDropdownList(filtered);
        }

        function toggleDropdown() {
            const wrapper = document.getElementById('categoryDropdown');
            wrapper.classList.toggle('open');
            if (wrapper.classList.contains('open')) {
                document.getElementById('catSearchInput').focus();
            }
        }

        function closeDropdown() {
            document.getElementById('categoryDropdown').classList.remove('open');
        }

        function setupOutsideClick() {
            document.addEventListener('click', (e) => {
                const wrapper = document.getElementById('categoryDropdown');
                if (!wrapper.contains(e.target)) {
                    closeDropdown();
                }
            });
        }

        function selectCategory(categoryId) {
            currentCategoryId = categoryId;
            currentPage = 1;

            const activeCat = categoriesList.find(c => c.category_id === currentCategoryId);
            if (activeCat) {
                document.getElementById('categoryTitle').innerText = `📁 Категория: ${activeCat.name}`;
                document.getElementById('selectedCategoryName').innerText = `${activeCat.name} (${activeCat.photo_count})`;
                document.getElementById('photoCounter').innerText = `🖼 Фотографий: ${activeCat.photo_count}`;
            }

            renderDropdownList(categoriesList);
            renderQuickChips();

            loadPhotos();
        }

        async function loadPhotos() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Загрузка изображений...</div>';

            try {
                const url = `/gallery/paginate_photos?category=${currentCategoryId}&page=${currentPage}&limit=${ITEMS_PER_PAGE}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Ошибка загрузки фото');

                const data = await response.json();
                
                currentPhotos = data.items;
                totalPages = data.pages_total;

                renderGallery();
                renderPagination();
            } catch (error) {
                console.error('API Error:', error);
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--danger); padding: 40px;">Ошибка загрузки фотографий</div>';
            }
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            if (currentPhotos.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">В этой категории пока нет фото</div>';
                return;
            }

            currentPhotos.forEach((photo, idx) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.onclick = () => openLightbox(idx);
                card.innerHTML = `<img src="${photo.file_url}" alt="Photo #${photo.id}" loading="lazy">`;
                grid.appendChild(card);
            });
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';

            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerText = '‹';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => goToPage(currentPage - 1);
            container.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.innerText = i;
                pageBtn.onclick = () => goToPage(i);
                container.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerText = '›';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => goToPage(currentPage + 1);
            container.appendChild(nextBtn);
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadPhotos();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openLightbox(index) {
            if (!currentPhotos[index]) return;
            currentLightboxIndex = index;
            updateLightboxContent();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function changeLightboxImage(direction) {
            currentLightboxIndex += direction;

            if (currentLightboxIndex < 0) {
                currentLightboxIndex = currentPhotos.length - 1;
            } else if (currentLightboxIndex >= currentPhotos.length) {
                currentLightboxIndex = 0;
            }

            updateLightboxContent();
        }

        function updateLightboxContent() {
            const photo = currentPhotos[currentLightboxIndex];
            if (!photo) return;

            document.getElementById('lightboxImg').src = photo.file_url;
            document.getElementById('lightboxCaption').innerText = 
                `Фото ID: ${photo.id} (${currentLightboxIndex + 1} из ${currentPhotos.length} на странице)`;

            const actionsContainer = document.getElementById('lightboxActions');
            actionsContainer.innerHTML = '';

            if (IS_MODER) {
                const resortBtn = document.createElement('button');
                resortBtn.className = 'btn-action';
                resortBtn.innerHTML = '🔄 Пересортировка';
                resortBtn.onclick = () => resortPhoto(photo.id);
                actionsContainer.appendChild(resortBtn);
            }
        }

        async function resortPhoto(photoId) {
            try {
                const response = await fetch(`/gallery/resort?photo_id=${photoId}`);
                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'Отправлено на пересортировку', false);
                    closeLightbox();
                    loadPhotos();
                } else {
                    showToast(data.message || 'Ошибка выполнения действия', true);
                }
            } catch (error) {
                console.error('Resort Error:', error);
                showToast('Ошибка при отправке запроса на сервер', true);
            }
        }

        function setupKeyboardNavigation() {
            document.addEventListener('keydown', (e) => {
                const lightbox = document.getElementById('lightbox');
                if (!lightbox.classList.contains('active')) return;

                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') changeLightboxImage(-1);
                if (e.key === 'ArrowRight') changeLightboxImage(1);
            });
        }
    </script>
</body>
</html>
