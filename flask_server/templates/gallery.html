<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossDaun Gallery</title>
    <link rel="shortcut icon" href="./static/favicon.ico" />
    <style>
        :root {
            --bg-primary: #0a0c10;
            --card-bg: rgba(18, 22, 31, 0.9);
            --bg-secondary: rgba(15, 18, 26, 0.95);
            --accent-cyan: #00f2fe;
            --accent-purple: #9d4edd;
            --accent-hover: #00c6ff;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-glow: rgba(0, 242, 254, 0.15);
            --border-purple: rgba(157, 78, 221, 0.25);
            --danger: #ff5555;
            --success: #2ecc71;
            --radius: 14px;
            --transition: transform 0.2s ease, opacity 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Контейнер для всплывающих уведомлений */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            min-width: 280px;
            padding: 12px 20px;
            border-radius: var(--radius);
            background: rgba(14, 18, 27, 0.95);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            font-size: 0.9rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(-20px);
            transition: var(--transition);
            pointer-events: auto;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            border-color: rgba(0, 242, 254, 0.4);
        }

        .toast.error {
            border-color: rgba(255, 85, 85, 0.4);
            color: var(--danger);
        }

        /* Фоновые неоновые пятна */
        .glow-sphere-1, .glow-sphere-2 {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        .glow-sphere-1 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -50px;
            left: -50px;
            animation: pulse 8s infinite alternate ease-in-out;
        }

        .glow-sphere-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.12) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            right: -50px;
            animation: pulse 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(15px, -15px); }
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-glow);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        @supports (backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px)) {
            @media (min-width: 769px) {
                header {
                    backdrop-filter: blur(12px);
                    -webkit-backdrop-filter: blur(12px);
                }
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .photo-counter {
            color: var(--accent-cyan);
            font-size: 0.85rem;
            background: rgba(0, 242, 254, 0.08);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .controls-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .custom-select-wrapper {
            position: relative;
            min-width: 240px;
            flex-shrink: 0;
        }

        .select-trigger {
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .select-trigger .arrow {
            font-size: 0.75rem;
            transition: transform 0.2s;
            color: var(--accent-cyan);
        }

        .custom-select-wrapper.open .arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(14, 18, 27, 0.98);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            max-height: 300px;
            z-index: 100;
            overflow: hidden;
        }

        .custom-select-wrapper.open .dropdown-menu {
            display: flex;
        }

        .dropdown-search {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background-color: rgba(0, 0, 0, 0.2);
        }

        .dropdown-search input {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
        }

        .dropdown-list {
            overflow-y: auto;
            max-height: 240px;
            -webkit-overflow-scrolling: touch;
        }

        .dropdown-item {
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text-main);
        }

        .dropdown-item.selected {
            background: rgba(0, 242, 254, 0.15);
            border-left: 3px solid var(--accent-cyan);
        }

        .dropdown-item .badge {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .quick-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .quick-chips::-webkit-scrollbar {
            display: none;
        }

        .chip-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.82rem;
        }

        .chip-btn.active {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            font-weight: 600;
        }

        main {
            flex: 1;
            padding: 20px 0;
            position: relative;
            z-index: 1;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .photo-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            border: 1px solid var(--border-glow);
            position: relative;
            transform: translateZ(0);
            content-visibility: auto;
            contain-intrinsic-size: 160px;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .page-btn.active {
            background: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
        }

        .page-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(5, 7, 10, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            touch-action: none; /* Отключаем дефолтный скролл браузера в модалке */
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative;
            max-width: 95vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-content img {
            max-width: calc(100vw - 100px);
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--border-glow);
            user-select: none;
            -webkit-user-drag: none;
        }

        .lightbox-caption {
            margin-top: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            text-align: center;
            background: rgba(18, 22, 31, 0.9);
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
        }

        .lightbox-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: var(--card-bg);
            color: var(--accent-cyan);
            border: 1px solid var(--border-glow);
            padding: 8px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lightbox-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(18, 22, 31, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-cyan);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1006;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(18, 22, 31, 0.75);
            color: var(--accent-cyan);
            border: 1px solid var(--border-glow);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1005;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--card-bg);
            color: var(--accent-cyan);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-home svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lightbox-prev { left: 10px; }
        .lightbox-next { right: 10px; }

        /* Оптимизация для мобильных устройств */
        @media (max-width: 768px) {
            .glow-sphere-1, .glow-sphere-2 {
                display: none; /* Выключаем тяжелые градиентные пятна на мобильных */
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
                gap: 8px;
            }

            .lightbox-content img {
                max-width: calc(100vw - 20px);
                max-height: 65vh;
            }

            .lightbox-prev { left: 5px; }
            .lightbox-next { right: 5px; }

            .lightbox-nav {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }

            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }

            .custom-select-wrapper {
                width: 100%;
            }
        }
    </style>
</head>
<body data-is-moder="{{ 'true' if user and user.is_moder else 'false' }}"> 

    <div class="toast-container" id="toastContainer"></div>

    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <header>
        <div class="container">
            <div class="header-content">
                <div class="title-area">
                    <div class="header-title-wrapper">
                        <a href="/" class="btn-home" title="На главную">
                            <svg viewBox="0 0 24 24">
                                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                            </svg>
                        </a>
                        <h1 id="categoryTitle">📁 Загрузка категорий...</h1>
                    </div>
                    <span class="photo-counter" id="photoCounter"></span>
                </div>
                
                <div class="controls-row">
                    <div class="custom-select-wrapper" id="categoryDropdown">
                        <div class="select-trigger" onclick="toggleDropdown()">
                            <span id="selectedCategoryName">Выберите категорию</span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="dropdown-menu">
                            <div class="dropdown-search">
                                <input type="text" id="catSearchInput" placeholder="Поиск категории..." oninput="filterCategories()">
                            </div>
                            <div class="dropdown-list" id="dropdownList"></div>
                        </div>
                    </div>

                    <div class="quick-chips" id="quickChipsContainer"></div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="gallery-grid" id="galleryGrid"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" onclick="changeLightboxImage(-1)">&#10094;</button>
        <div class="lightbox-content" id="lightboxContent">
            <img id="lightboxImg" src="" alt="Enlarged image">
            <div class="lightbox-caption" id="lightboxCaption"></div>
            <div class="lightbox-actions" id="lightboxActions"></div>
        </div>
        <button class="lightbox-nav lightbox-next" onclick="changeLightboxImage(1)">&#10095;</button>
    </div>

    <script> 
        const IS_MODER = document.body.dataset.isModer === 'true';

        // Меньше картинок на страницу на мобилках для экономии памяти
        const ITEMS_PER_PAGE = window.innerWidth <= 768 ? 16 : 32;
        let categoriesList = [];       
        let currentCategoryId = null;  
        let currentPage = 1;           
        let currentPhotos = [];        
        let currentLightboxIndex = 0;  
        let totalPages = 1;            

        document.addEventListener('DOMContentLoaded', () => {
            initGallery();
            setupKeyboardNavigation();
            setupOutsideClick();
            setupSwipeGestures();
        });

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : 'success'}`;
            toast.innerText = message;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 200);
            }, 3000);
        }

        async function initGallery() {
            try {
                const response = await fetch('/gallery/get_categories');
                if (!response.ok) throw new Error('Ошибка при загрузке категорий');
                
                categoriesList = await response.json();

                if (categoriesList.length === 0) {
                    document.getElementById('categoryTitle').innerText = '📁 Категории отсутствуют';
                    document.getElementById('selectedCategoryName').innerText = 'Нет категорий';
                    return;
                }

                renderCategoryControls();
                selectCategory(categoriesList[0].category_id);
            } catch (error) {
                console.error('API Error:', error);
                document.getElementById('categoryTitle').innerText = '❌ Ошибка загрузки данных';
            }
        }

        function renderCategoryControls() {
            renderDropdownList(categoriesList);
            renderQuickChips();
        }

        function renderDropdownList(list) {
            const container = document.getElementById('dropdownList');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div style="padding: 12px; color: var(--text-muted); text-align: center; font-size: 0.85rem;">Ничего не найдено</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            list.forEach(cat => {
                const item = document.createElement('div');
                item.className = `dropdown-item ${cat.category_id === currentCategoryId ? 'selected' : ''}`;
                item.innerHTML = `
                    <span>${cat.name}</span>
                    <span class="badge">${cat.photo_count}</span>
                `;
                item.onclick = () => {
                    selectCategory(cat.category_id);
                    closeDropdown();
                };
                fragment.appendChild(item);
            });
            container.appendChild(fragment);
        }

        function renderQuickChips() {
            const container = document.getElementById('quickChipsContainer');
            container.innerHTML = '';

            const topCategories = categoriesList.slice(0, 5);
            const fragment = document.createDocumentFragment();
            topCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `chip-btn ${cat.category_id === currentCategoryId ? 'active' : ''}`;
                btn.innerText = `${cat.name} (${cat.photo_count})`;
                btn.onclick = () => selectCategory(cat.category_id);
                fragment.appendChild(btn);
            });
            container.appendChild(fragment);
        }

        function filterCategories() {
            const query = document.getElementById('catSearchInput').value.toLowerCase().trim();
            const filtered = categoriesList.filter(c => c.name.toLowerCase().includes(query));
            renderDropdownList(filtered);
        }

        function toggleDropdown() {
            const wrapper = document.getElementById('categoryDropdown');
            wrapper.classList.toggle('open');
            if (wrapper.classList.contains('open')) {
                document.getElementById('catSearchInput').focus();
            }
        }

        function closeDropdown() {
            document.getElementById('categoryDropdown').classList.remove('open');
        }

        function setupOutsideClick() {
            document.addEventListener('click', (e) => {
                const wrapper = document.getElementById('categoryDropdown');
                if (!wrapper.contains(e.target)) {
                    closeDropdown();
                }
            });
        }

        function selectCategory(categoryId) {
            currentCategoryId = categoryId;
            currentPage = 1;

            const activeCat = categoriesList.find(c => c.category_id === currentCategoryId);
            if (activeCat) {
                document.getElementById('categoryTitle').innerText = `📁 Категория: ${activeCat.name}`;
                document.getElementById('selectedCategoryName').innerText = `${activeCat.name} (${activeCat.photo_count})`;
                document.getElementById('photoCounter').innerText = `🖼 Фотографий: ${activeCat.photo_count}`;
            }

            renderDropdownList(categoriesList);
            renderQuickChips();

            loadPhotos();
        }

        async function loadPhotos() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Загрузка изображений...</div>';

            try {
                const url = `/gallery/paginate_photos?category=${currentCategoryId}&page=${currentPage}&limit=${ITEMS_PER_PAGE}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Ошибка загрузки фото');

                const data = await response.json();
                
                currentPhotos = data.items;
                totalPages = data.pages_total;

                renderGallery();
                renderPagination();
            } catch (error) {
                console.error('API Error:', error);
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--danger); padding: 40px;">Ошибка загрузки фотографий</div>';
            }
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            if (currentPhotos.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">В этой категории пока нет фото</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            currentPhotos.forEach((photo, idx) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.onclick = () => openLightbox(idx);
                card.innerHTML = `<img src="${photo.file_url}" alt="Photo #${photo.id}" loading="lazy" decoding="async">`;
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';

            if (totalPages <= 1) return;

            const fragment = document.createDocumentFragment();

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerText = '‹';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => goToPage(currentPage - 1);
            fragment.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.innerText = i;
                pageBtn.onclick = () => goToPage(i);
                fragment.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerText = '›';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => goToPage(currentPage + 1);
            fragment.appendChild(nextBtn);

            container.appendChild(fragment);
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadPhotos();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openLightbox(index) {
            if (!currentPhotos[index]) return;
            currentLightboxIndex = index;
            updateLightboxContent();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function changeLightboxImage(direction) {
            currentLightboxIndex += direction;

            if (currentLightboxIndex < 0) {
                currentLightboxIndex = currentPhotos.length - 1;
            } else if (currentLightboxIndex >= currentPhotos.length) {
                currentLightboxIndex = 0;
            }

            updateLightboxContent();
        }

        function updateLightboxContent() {
            const photo = currentPhotos[currentLightboxIndex];
            if (!photo) return;

            document.getElementById('lightboxImg').src = photo.file_url;
            document.getElementById('lightboxCaption').innerText = 
                `Фото ID: ${photo.id} (${currentLightboxIndex + 1} из ${currentPhotos.length} на странице)`;

            const actionsContainer = document.getElementById('lightboxActions');
            actionsContainer.innerHTML = '';

            if (IS_MODER) {
                const resortBtn = document.createElement('button');
                resortBtn.className = 'btn-action';
                resortBtn.innerHTML = '🔄 Пересортировка';
                resortBtn.onclick = () => resortPhoto(photo.id);
                actionsContainer.appendChild(resortBtn);
            }
        }

        async function resortPhoto(photoId) {
            try {
                const response = await fetch(`/gallery/resort?photo_id=${photoId}`);
                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'Отправлено на пересортировку', false);
                    closeLightbox();
                    loadPhotos();
                } else {
                    showToast(data.message || 'Ошибка выполнения действия', true);
                }
            } catch (error) {
                console.error('Resort Error:', error);
                showToast('Ошибка при отправке запроса на сервер', true);
            }
        }

        function setupKeyboardNavigation() {
            document.addEventListener('keydown', (e) => {
                const lightbox = document.getElementById('lightbox');
                if (!lightbox.classList.contains('active')) return;

                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') changeLightboxImage(-1);
                if (e.key === 'ArrowRight') changeLightboxImage(1);
            });
        }

        // Поддержка свайпов на смартфонах (Влево/Вправо — переключение, Вверх/Вниз — закрытие)
        function setupSwipeGestures() {
            const lightbox = document.getElementById('lightbox');
            let touchStartX = 0;
            let touchStartY = 0;
            let touchEndX = 0;
            let touchEndY = 0;

            lightbox.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            lightbox.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                const threshold = 50;

                // Проверяем, преобладает ли горизонтальный или вертикальный свайп
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    // Горизонтальный свайп (переключение фото)
                    if (deltaX < -threshold) {
                        changeLightboxImage(1);  // Свайп влево -> следующее фото
                    } else if (deltaX > threshold) {
                        changeLightboxImage(-1); // Свайп вправо -> предыдущее фото
                    }
                } else {
                    // Вертикальный свайп (закрытие Lightbox)
                    if (Math.abs(deltaY) > threshold) {
                        closeLightbox();
                    }
                }
            }
        }
    </script>
</body>
